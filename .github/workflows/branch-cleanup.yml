name: "Factory: Branch-Aufräumen"

# Deterministisch, ohne KI — Regelarbeit braucht keinen Agenten.
#   Beim Schließen eines PRs: Head-Branch löschen, wenn er gemergt wurde
#     oder ein Factory-Branch (agent/*) ist.
#   Wöchentlich: alle Branches löschen, deren PRs ausnahmslos gemergt sind,
#     die keinen offenen PR haben und seit 14 Tagen keinen Commit bekamen.
#     Geschlossene, nicht gemergte Nicht-Factory-Branches werden nur gemeldet —
#     dort könnte noch Arbeit stecken.
on:
  pull_request:
    types: [closed]
  schedule:
    - cron: '29 5 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Nur anzeigen, nichts löschen'
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: branch-cleanup
  cancel-in-progress: false

jobs:
  on-close:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.pull_request.merged || startsWith(github.event.pull_request.head.ref, 'agent/'))
    runs-on: ubuntu-latest
    steps:
      - name: Head-Branch löschen
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          DEFAULT: ${{ github.event.repository.default_branch }}
        run: |
          [ "$BRANCH" = "$DEFAULT" ] && exit 0
          # Andere offene PRs auf demselben Branch? Dann stehen lassen.
          OPEN=$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=open&head=${GITHUB_REPOSITORY_OWNER}:${BRANCH}" --jq length)
          if [ "$OPEN" != "0" ]; then echo "Offener PR auf $BRANCH — bleibt."; exit 0; fi
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$BRANCH" \
            && echo "Gelöscht: $BRANCH" || echo "Bereits weg: $BRANCH"

  sweep:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Verwaiste Branches aufräumen
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT: ${{ github.event.repository.default_branch }}
          # Cron läuft scharf, manuell standardmäßig als Probelauf
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        run: |
          CUTOFF=$(date -u -d '14 days ago' +%s)
          REPORT=""
          for B in $(gh api --paginate "repos/$GITHUB_REPOSITORY/branches?per_page=100" --jq '.[] | select(.protected|not) | .name'); do
            [ "$B" = "$DEFAULT" ] && continue
            PRS=$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=all&head=${GITHUB_REPOSITORY_OWNER}:${B}&per_page=100")
            TOTAL=$(jq length <<<"$PRS")
            OPEN=$(jq '[.[] | select(.state=="open")] | length' <<<"$PRS")
            UNMERGED=$(jq '[.[] | select(.state=="closed" and .merged_at==null)] | length' <<<"$PRS")
            LAST=$(gh api "repos/$GITHUB_REPOSITORY/commits/$B" --jq '.commit.committer.date')
            OLD=$([ "$(date -u -d "$LAST" +%s)" -lt "$CUTOFF" ] && echo yes || echo no)

            if [ "$TOTAL" = "0" ] || [ "$OPEN" != "0" ] || [ "$OLD" = "no" ]; then
              continue   # nie als PR gelaufen, noch offen oder frisch → bleibt
            fi
            if [ "$UNMERGED" = "0" ] || [[ "$B" == agent/* ]]; then
              if [ "$DRY_RUN" = "true" ]; then
                echo "Würde löschen: $B"
              else
                gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$B" && echo "Gelöscht: $B"
              fi
            else
              REPORT="$REPORT\n- \`$B\` (PR geschlossen ohne Merge, letzter Commit $LAST)"
            fi
          done
          if [ -n "$REPORT" ]; then
            printf "### Nicht gemergte Branches — bitte selbst entscheiden\n%b\n" "$REPORT" >> "$GITHUB_STEP_SUMMARY"
          fi
